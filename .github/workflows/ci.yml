name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build on Node.js 24 and test the installed node on Node.js 22
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js for the development tools
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Use npm 11.6.1
        run: npm install --global npm@11.6.1

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, lint, types, tests and build
        run: npm run verify

      - name: Pack the node for installation
        run: |
          mkdir "$RUNNER_TEMP/qr-package"
          npm pack --pack-destination "$RUNNER_TEMP/qr-package"

      - name: Set up Node.js for the runtime check
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install and exercise the packed node with a Node.js 22 compatible n8n peer
        run: |
          mkdir "$RUNNER_TEMP/qr-consumer"
          cd "$RUNNER_TEMP/qr-consumer"
          npm init --yes
          npm install --omit=dev n8n-workflow@2.30.2 "$RUNNER_TEMP"/qr-package/*.tgz
          node "$GITHUB_WORKSPACE/tests/installed-package-smoke.mjs" "$PWD"

  audit:
    name: Audit the committed lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.6.1

      - name: Audit production dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: Audit all dependencies, including development tools
        run: npm audit --package-lock-only --include=dev --audit-level=high
